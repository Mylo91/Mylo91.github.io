<!-- EB Garamond + Manrope both support Greek and Hungarian (ő, ű). Parisienne is only used for the Latin-script names. -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f7f2ea; --surface:#fffdf9; --ink:#3a3530; --muted:#7a7068;
  --sage:#8a9a7b; --sage-soft:#e4e9dc; --sage-deep:#5f7052;
  --terra:#b8664a; --terra-soft:#f3e1d8; --sky:#6f8fa3; --line:#e6ddd0;
  --radius:18px; --shadow:0 1px 2px rgba(58,53,48,.05),0 8px 24px rgba(58,53,48,.06);
  --serif:"EB Garamond",Georgia,serif; --sans:"Manrope",system-ui,sans-serif; --script:"Parisienne",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--terra)}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0}
h2{font-size:clamp(2rem,5vw,2.6rem);text-align:center}
h3{font-size:1.35rem}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.icon{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.mono{font-family:var(--script);font-size:1.6rem;color:var(--terra);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:var(--ink);text-decoration:none;font-size:.88rem;padding:6px 10px;border-radius:999px}
.nav a:hover{background:var(--sage-soft)}
.langs{display:flex;gap:2px;font-size:.85rem;font-weight:600;letter-spacing:.04em}
.langs button{border:0;background:none;font:inherit;color:var(--muted);padding:6px 7px;border-radius:8px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--terra);background:var(--terra-soft)}
.menu-btn{display:none;border:0;background:none;color:var(--ink);padding:6px;cursor:pointer}
@media (max-width:860px){
  .menu-btn{display:block;margin-left:auto}
  .langs{order:3}
  .nav{position:absolute;top:60px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px 16px;display:none;margin:0}
  .nav.open{display:flex}
  .nav a{padding:12px;font-size:1rem}
}

/* ---------- hero ---------- */
.hero{text-align:center;padding:56px 0 40px}
.hero .branch{width:min(260px,70%);margin:0 auto;color:var(--sage)}
.names{font-family:var(--script);font-weight:400;font-size:clamp(3.4rem,13vw,6rem);color:var(--terra);line-height:1.1;margin:8px 0 0}
.date{font-family:var(--serif);font-size:1.4rem;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.welcome-msg{font-family:var(--serif);font-size:clamp(1.25rem,3.4vw,1.55rem);font-style:italic;max-width:620px;margin:28px auto 0;color:var(--ink)}
.venue{margin:28px auto 0;display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.venue strong{font-family:var(--serif);font-size:1.4rem;font-weight:500}
.venue > span{color:var(--muted);font-size:.95rem}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--terra);color:#fff;text-decoration:none;border-radius:999px;padding:11px 20px;font-weight:600;font-size:.95rem;border:0;cursor:pointer;margin-top:18px}
.btn:hover{background:#a5583e}
.btn.ghost{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.btn.ghost:hover{background:var(--terra-soft)}
.looking{margin-top:28px;color:var(--muted)}

/* ---------- sections ---------- */
section{padding:64px 0}
section:nth-of-type(even){background:var(--surface)}
.kicker{display:block;text-align:center;color:var(--sage-deep);margin-bottom:10px}
.kicker .icon{width:28px;height:28px;margin:0 auto}
.lead{text-align:center;max-width:620px;margin:14px auto 36px;color:var(--muted)}

/* schedule */
.timeline{list-style:none;margin:0 auto;padding:0;max-width:520px}
.timeline li{display:grid;grid-template-columns:72px 24px 1fr;align-items:start;gap:12px;padding:0 0 26px;position:relative}
.timeline time{font-family:var(--serif);font-size:1.35rem;color:var(--terra);text-align:right;line-height:1.3}
.timeline .dot{width:12px;height:12px;border-radius:50%;background:var(--sage);margin:8px auto 0;box-shadow:0 0 0 5px var(--sage-soft);position:relative;z-index:1}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:calc(72px + 12px + 11px);top:22px;bottom:2px;width:2px;background:var(--line)}
.timeline span{font-size:1.08rem;padding-top:4px}

/* activities */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
section:nth-of-type(even) .day{background:var(--bg)}
.day.main{border-color:var(--terra);background:var(--terra-soft)!important}
.day .d{font-family:var(--serif);font-size:1rem;text-transform:uppercase;letter-spacing:.1em;color:var(--sage-deep)}
.day h3{margin:6px 0 8px}
.day p{margin:0 0 10px}
.tba{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);background:var(--sage-soft);border-radius:999px;padding:4px 12px}

/* practical */
#map{height:420px;border-radius:var(--radius);border:1px solid var(--line);z-index:1;background:var(--sage-soft)}
.map-tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:12px 0 36px;font-size:.88rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.zone{border-radius:3px;background:rgba(138,154,123,.35);border:1.5px dashed var(--sage-deep)}
.map-tools .btn{margin:0;padding:8px 16px;font-size:.85rem}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.info article{background:var(--surface);border-radius:var(--radius);padding:24px;border:1px solid var(--line)}
.info h3{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.info h3 .icon{color:var(--terra)}
.info p{margin:0 0 10px}
.info p:last-child{margin-bottom:0}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.92rem}

/* recommendations */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.rec{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.rec .ph{aspect-ratio:16/10;display:grid;place-items:center;background-size:cover;background-position:center}
.rec .ph .icon{width:56px;height:56px;stroke-width:1.2}
.rec .ph.has-img .icon{display:none}
.rec.food .ph{background-color:var(--terra-soft);color:var(--terra)}
.rec.drinks .ph{background-color:var(--sage-soft);color:var(--sage-deep)}
.rec.sights .ph{background-color:#e2eaef;color:var(--sky)}
.rec .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.rec h3{margin-bottom:6px}
.rec p{margin:0 0 12px}
.rec .places{list-style:none;padding:0;margin:auto 0 0;display:grid;gap:10px}
.rec .places li{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.rec .places b{color:var(--ink);font-weight:600}
.rec .acts{display:flex;gap:14px;margin-top:4px}
.rec .acts a,.rec .acts button{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:.85rem;font-weight:600;color:var(--terra);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.rec .acts .icon{width:1em;height:1em}

/* footer */
footer{text-align:center;padding:64px 0 72px;background:var(--sage-soft)}
footer .branch{width:160px;margin:0 auto 14px;color:var(--sage-deep)}
footer p{margin:6px 0}
footer .gift{font-family:var(--serif);font-size:1.5rem;font-style:italic}
footer .sig{font-family:var(--script);font-size:2rem;color:var(--terra);margin-top:18px}

/* leaflet bits */
.leaflet-tile-pane{filter:saturate(.45) sepia(.18) brightness(1.03)}
.leaflet-popup-content{font-family:var(--sans);font-size:.88rem;line-height:1.45}
.leaflet-popup-content b{font-family:var(--serif);font-size:1.05rem;font-weight:600}
.venue-pin{background:var(--terra);color:#fff;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.zone-label{background:transparent;border:0;box-shadow:none;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--sage-deep)}
.zone-label::before{display:none}
</style>
</head>

  t:{en:"Bougatsa",hu:"Bougatsa",el:"Μπουγάτσα"},
  d:{en:"Have a bougatsa one morning. Anywhere is good! For something special, try Bougatsa Giannis: minced-meat bougatsa with Greek yogurt on top or, for the sweet-toothed, sweet bougatsa topped with Merenda.",
     hu:"Egyik reggel egyetek egy bougatsát. Bárhol jó! Ha valami különlegesre vágytok, próbáljátok a Bougatsa Giannisban a darált húsos bougatsát görög joghurttal, vagy az édesszájúak a Merenda-krémes édes változatot.",
     el:"Ένα πρωί φάτε μπουγάτσα. Οπουδήποτε είναι καλή! Για κάτι ξεχωριστό δοκιμάστε στον Γιάννη μπουγάτσα με κιμά και γιαούρτι από πάνω ή, για τους λάτρεις του γλυκού, γλυκιά με Μερέντα."},
  places:[{name:"Bougatsa Giannis",addr:"Mitropoleos 106, 546 21",lat:40.62792,lng:22.94924}]},
 {id:"meze",cat:"food",icon:"fish",
  t:{en:"Fish & meze",hu:"Hal és meze",el:"Ψάρι & μεζέδες"},
  d:{en:"Long, slow lunches with small plates to share.",
     hu:"Hosszú, ráérős ebédek közös kis tálakkal.",
     el:"Μεγάλα, χαλαρά τραπέζια με μεζέδες για μοίρασμα."},
  places:[{name:"Mezen",addr:"Rogkoti 3, 546 24",lat:40.63464,lng:22.93866},
          {name:"Elliniko",addr:"Str. Kallari 9, 546 22",lat:40.62840,lng:22.94727}]},
 {id:"drinks",cat:"drinks",icon:"glass",
  t:{en:"Evening drinks",hu:"Esti italozás",el:"Βραδινό ποτό"},
  d:{en:"In the evening, head to the Valaoritou or Ladadika area for cool bars and pubs.",
     hu:"Este menjetek a Valaoritou vagy a Ladadika negyedbe, tele vannak jó bárokkal és pubokkal.",
     el:"Το βράδυ πηγαίνετε στη Βαλαωρίτου ή στα Λαδάδικα για ωραία μπαρ."},
  places:[{name:"Valaoritou",addr:{en:"Bar street",hu:"Bárutca",el:"Περιοχή μπαρ"},lat:40.63750,lng:22.93932},
          {name:"Ladadika",addr:{en:"Old port quarter",hu:"Régi kikötőnegyed",el:"Παλιά συνοικία λιμανιού"},lat:40.63510,lng:22.93694}]}
];

const VENUE = {lat:40.533010,lng:23.005335};

/* "Where we'd stay" zone: Ladadika → below Egnatia → along the coast → Evzonon → Faliro.
   Edit corner points freely ([lat, lng]). */
const STAY_ZONE = [
  [40.6378,22.9318],[40.6405,22.9375],[40.6382,22.9445],[40.6350,22.9515],[40.6322,22.9572],
  [40.6262,22.9610],[40.6185,22.9640],[40.6110,22.9665],[40.6040,22.9660],[40.5985,22.9600],
  [40.6015,22.9540],[40.6090,22.9520],[40.6160,22.9505],[40.6235,22.9478],[40.6290,22.9440],
  [40.6335,22.9375]
];

/* ===================================================================== */
const CAT_COLOR = {food:"#b8664a",drinks:"#5f7052",sights:"#6f8fa3"};
const SUPPORTED = ["en","hu","el"];
let lang = "en", map, markers = {}, venueMarker, showingVenue = false;
const pick = v => (v && typeof v === "object") ? (v[lang] || v.en) : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dirUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

function detectLang(){
  try { const s = localStorage.getItem("lang"); if (SUPPORTED.includes(s)) return s; } catch(e){}
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const c = String(l).slice(0,2).toLowerCase();
    if (c === "el" || c === "hu") return c;
  }
  return "en";
}

function renderRecs(){
  const el = document.getElementById("recs");
  el.innerHTML = RECS.map(r => `
    <article class="rec ${r.cat}" id="rec-${r.id}">
      <div class="ph" data-img="images/${r.id}.jpg"><svg class="icon"><use href="#i-${r.icon}"/></svg></div>
      <div class="body">
        <h3>${esc(pick(r.t))}</h3>
        <p>${esc(pick(r.d))}</p>
        <ul class="places">${r.places.map((p,i) => `
          <li><b>${esc(pick(p.name))}</b> · ${esc(pick(p.addr))}
            <div class="acts">
              <a href="${dirUrl(p)}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-nav"/></svg>${T[lang]["rec.directions"]}</a>
              <button type="button" data-focus="${r.id}-${i}"><svg class="icon"><use href="#i-pin"/></svg>${T[lang]["rec.onmap"]}</button>
            </div></li>`).join("")}
        </ul>
      </div>
    </article>`).join("");
  // Photos: show images/<id>.jpg if it exists, otherwise keep the icon tile.
  el.querySelectorAll(".ph[data-img]").forEach(ph => {
    const img = new Image();
    img.onload = () => { ph.style.backgroundImage = `url("${ph.dataset.img}")`; ph.classList.add("has-img"); };
    img.src = ph.dataset.img;
  });
  el.querySelectorAll("[data-focus]").forEach(b => b.addEventListener("click", () => focusPlace(b.dataset.focus)));
}

function setLang(l){
  lang = SUPPORTED.includes(l) ? l : "en";
  try { localStorage.setItem("lang", lang); } catch(e){}
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(n => { const v = T[lang][n.dataset.i18n]; if (v != null) n.textContent = v; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderRecs();
  updateMapText();
}

/* ---------------- map ---------------- */
function initMap(){
  if (!window.L) { document.getElementById("map").style.display = "none"; return; }
  map = L.map("map", {scrollWheelZoom:false, tap:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.zone = L.polygon(STAY_ZONE, {color:"#5f7052", weight:2, dashArray:"6 6", fillColor:"#8a9a7b", fillOpacity:.22}).addTo(map);
  map.zone.bindTooltip("", {permanent:true, direction:"center", className:"zone-label"});
  RECS.forEach(r => r.places.forEach((p,i) => {
    const m = L.circleMarker([p.lat,p.lng], {radius:8, color:"#fff", weight:2, fillColor:CAT_COLOR[r.cat], fillOpacity:1}).addTo(map);
    markers[`${r.id}-${i}`] = {m, r, p};
  }));
  venueMarker = L.marker([VENUE.lat,VENUE.lng], {icon:L.divIcon({className:"", html:'<div class="venue-pin" style="width:34px;height:34px"><svg class="icon" style="width:18px;height:18px"><use href="#i-heart"/></svg></div>', iconSize:[34,34], iconAnchor:[17,17]})}).addTo(map);
  showCity();
  document.getElementById("venueToggle").addEventListener("click", () => showingVenue ? showCity() : showVenue());
}
function showCity(){ showingVenue = false; map.fitBounds(map.zone.getBounds().pad(0.08)); updateMapText(); }
function showVenue(){ showingVenue = true; map.fitBounds(L.latLngBounds([map.zone.getBounds().getCenter(), [VENUE.lat,VENUE.lng]]).pad(0.15)); venueMarker.openPopup(); updateMapText(); }
function updateMapText(){
  if (!map) return;
  const t = T[lang];
  map.zone.setTooltipContent(t["map.zone"]);
  map.zone.bindPopup(t["map.zonePop"]);
  venueMarker.bindPopup(`<b>Kiwi Garden</b><br>${esc(t["map.venuePop"])}<br><a href="${dirUrl(VENUE)}" target="_blank" rel="noopener">${esc(t["welcome.directions"])} ↗</a>`);
  Object.values(markers).forEach(({m,r,p}) => m.bindPopup(`<b>${esc(pick(r.t))}</b><br>${esc(pick(p.name))} · ${esc(pick(p.addr))}<br><a href="${dirUrl(p)}" target="_blank" rel="noopener">${esc(t["rec.directions"])} ↗</a>`));
  document.querySelector('#venueToggle span').textContent = showingVenue ? t["map.showCity"] : t["map.showVenue"];
}
function focusPlace(key){
  const it = markers[key]; if (!it) return;
  document.getElementById("map").scrollIntoView({behavior:"smooth", block:"center"});
  showingVenue = false; updateMapText();
  setTimeout(() => { map.setView(it.m.getLatLng(), 17); it.m.openPopup(); }, 350);
}

/* ---------------- boot ---------------- */
document.querySelectorAll("[data-branch]").forEach(n => n.replaceWith(document.getElementById("branch-tpl").content.cloneNode(true)));
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
const nav = document.getElementById("nav"), menuBtn = document.getElementById("menuBtn");
menuBtn.addEventListener("click", () => { const o = nav.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", o); });
nav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", false); }));
initMap();
setLang(detectLang());
</script>
</body>
</html>
